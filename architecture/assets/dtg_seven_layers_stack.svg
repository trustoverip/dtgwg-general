<svg width="100%" viewBox="0 0 680 540" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:680px">
  <title>The seven DTG architecture layers</title>
  <desc>Seven layers stacked vertically, from actors at the top through access, management, communities, standards, topology, to governance — these are concern-separations, not protocol-stack layers.</desc>

  <rect x="120" y="40" width="440" height="50" rx="8" fill="#F5F0FF" stroke="#B7A7E8" stroke-width="0.7"/>
  <text x="340" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4B3B83">Layer I — Actors and entities</text>
  <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#4B3B83">Who or what participates</text>

  <rect x="120" y="105" width="440" height="50" rx="8" fill="#EEF4FF" stroke="#9BBCEB" stroke-width="0.7"/>
  <text x="340" y="125" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#285E95">Layer II — Human access</text>
  <text x="340" y="143" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#285E95">PNM, CNM, wallet, access devices</text>

  <rect x="120" y="170" width="440" height="50" rx="8" fill="#EAFBFA" stroke="#8FD3CE" stroke-width="0.7"/>
  <text x="340" y="190" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#176B66">Layer III — Management infrastructure</text>
  <text x="340" y="208" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#176B66">VTAs and VTA networks</text>

  <rect x="120" y="235" width="440" height="50" rx="8" fill="#EFFBEF" stroke="#9BD89B" stroke-width="0.7"/>
  <text x="340" y="255" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2F6F37">Layer IV — Communities and networks</text>
  <text x="340" y="273" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#2F6F37">VTCs, VTNs, trust registries</text>

  <rect x="120" y="300" width="440" height="50" rx="8" fill="#FFF8D9" stroke="#E8D37A" stroke-width="0.7"/>
  <text x="340" y="320" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#7A6518">Layer V — Standards and protocols</text>
  <text x="340" y="338" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#7A6518">DIDs, credentials, trust tasks</text>

  <rect x="120" y="365" width="440" height="50" rx="8" fill="#FFF0E5" stroke="#E7B28D" stroke-width="0.7"/>
  <text x="340" y="385" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#8A4A21">Layer VI — Topology</text>
  <text x="340" y="403" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#8A4A21">Node view and edge view</text>

  <rect x="120" y="430" width="440" height="50" rx="8" fill="#FFF0F6" stroke="#E5A3C1" stroke-width="0.7"/>
  <text x="340" y="450" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#874263">Layer VII — Governance</text>
  <text x="340" y="468" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#874263">What counts, who is trusted</text>

  <text x="340" y="510" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Layers interpret and depend on each other — they are not a protocol stack</text>
</svg>