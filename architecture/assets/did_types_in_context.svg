<svg width="100%" viewBox="0 0 680 390" role="img" xmlns="http://www.w3.org/2000/svg" style="max-width:680px">
  <title>DTG DID types in context</title>
  <desc>R-DID identifies a peer-to-peer relationship party context, M-DID a membership context, C-DID a community, P-DID a persona.</desc>

  <rect x="40" y="50" width="140" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="110" y="73" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">R-DID</text>
  <text x="110" y="91" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Relationship party</text>

  <rect x="40" y="140" width="140" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="110" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Used between two</text>
  <text x="110" y="181" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">peers in a pairwise</text>
  <text x="110" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">relationship</text>

  <rect x="200" y="50" width="140" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="270" y="73" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">M-DID</text>
  <text x="270" y="91" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Membership context</text>

  <rect x="200" y="140" width="140" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="270" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Identifies a member</text>
  <text x="270" y="181" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">within a specific</text>
  <text x="270" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">community</text>

  <rect x="360" y="50" width="140" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="430" y="73" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">C-DID</text>
  <text x="430" y="91" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Community</text>

  <rect x="360" y="140" width="140" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="430" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Identifies a VTC</text>
  <text x="430" y="181" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">itself, as its own</text>
  <text x="430" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">DTG presence</text>

  <rect x="520" y="50" width="140" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="590" y="73" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">P-DID</text>
  <text x="590" y="91" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">Persona</text>

  <rect x="520" y="140" width="140" height="76" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="590" y="162" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Identifies a persona</text>
  <text x="590" y="181" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">for intentional</text>
  <text x="590" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">correlation</text>

  <text x="340" y="275" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Each DID identifies a trust context — not always a standalone DTG node.</text>
  <text x="340" y="295" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">All four are DIDs, which are one type of Verifiable Identifier (VID).</text>
</svg>
